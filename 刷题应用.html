<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刷题应用</title>
<style>
  :root{
    --green-900:#14532d; --green-700:#15803d; --green-600:#16a34a;
    --green-100:#dcfce7; --green-50:#f0fdf4;
    --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --red:#dc2626; --red-bg:#fee2e2; --amber:#d97706; --amber-bg:#fef3c7;
    --bg:#f6f8f6; --card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{position:sticky;top:0;z-index:10;background:var(--green-900);color:#fff;
         padding:14px 16px 12px;}
  header .t{font-size:17px;font-weight:700;}
  header .s{font-size:12px;opacity:.75;}
  main{flex:1;padding:14px 14px 110px;}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;
      border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;}
  nav button{flex:1;background:none;border:none;padding:10px 0;cursor:pointer;
             font-size:13px;color:var(--sub);font-family:inherit;}
  nav button.active{color:var(--green-700);font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:15px;margin-bottom:12px;}
  h1.page-title{font-size:20px;margin:2px 0 2px;color:var(--green-900);}
  .subtitle{font-size:13px;color:var(--sub);margin:0 0 14px;}
  .muted{font-size:12px;color:var(--sub);}
  .sec-t{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:24px 0;}
  /* 今日进度 */
  .today-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;}
  .today-cell{background:var(--bg);border-radius:10px;padding:12px 6px;}
  .today-cell .num{font-size:22px;font-weight:800;color:var(--green-700);}
  .today-cell .num.red{color:var(--red);}
  .today-cell .lab{font-size:12px;color:var(--sub);margin-top:2px;}
  /* 首页四入口 */
  .entries{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:16px 14px;cursor:pointer;text-align:left;font-family:inherit;}
  .entry .e-t{font-size:15px;font-weight:700;}
  .entry .e-d{font-size:12px;color:var(--sub);margin-top:2px;}
  .entry:active{border-color:var(--green-600);}
  /* 列表项 */
  .list-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
             border-radius:12px;padding:10px 12px;cursor:pointer;margin-bottom:8px;width:100%;
             text-align:left;font-family:inherit;}
  .list-item .no{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:var(--green-100);
                 color:var(--green-900);font-weight:800;display:flex;align-items:center;justify-content:center;}
  .list-item .txt{flex:1;font-size:14px;font-weight:600;color:var(--ink);}
  /* 选项 */
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
       background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
       font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:8px;}
  .opt:active{border-color:var(--green-600);}
  .opt .k{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
          display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub);}
  .opt.sel{border-color:var(--green-600);background:var(--green-50);}
  .opt.sel .k{border-color:var(--green-600);background:var(--green-600);color:#fff;}
  .opt.right{border-color:var(--green-600);background:var(--green-100);}
  .opt.right .k{border-color:var(--green-600);background:var(--green-600);color:#fff;}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.wrong .k{border-color:var(--red);background:var(--red);color:#fff;}
  .opt.dis{pointer-events:none;}
  .feedback{margin-top:4px;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;}
  .feedback.ok{background:var(--green-100);color:var(--green-900);}
  .feedback.no{background:var(--red-bg);color:#991b1b;}
  .q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--green-100);color:var(--green-900);font-weight:600;}
  .badge.multi{background:#e0f2fe;color:#075985;}
  .badge.judge{background:var(--amber-bg);color:#92400e;}
  .q-progress{font-size:12px;color:var(--sub);margin-left:auto;}
  .q-stem{font-size:16px;font-weight:600;margin:0 0 12px;word-break:break-word;}
  .q-actions{display:flex;gap:8px;margin-top:12px;}
  .btn{flex:1;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:700;
       cursor:pointer;font-family:inherit;}
  .btn.pri{background:var(--green-700);color:#fff;}
  .btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink);}
  .back-btn{display:block;width:100%;text-align:center;padding:12px;border:1.5px solid var(--line);
            border-radius:12px;background:var(--card);color:var(--ink);font-size:15px;font-weight:700;
            cursor:pointer;font-family:inherit;margin-top:4px;}
  /* 工具栏 */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  .toolbar button{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
                  padding:8px 4px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit;}
  .toolbar button.on{border-color:var(--amber);color:var(--amber);background:var(--amber-bg);}
  /* 答题卡 */
  .answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .answer-grid button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;
                      background:#fff;font-size:15px;font-weight:700;color:var(--ink);
                      cursor:pointer;font-family:inherit;}
  .answer-grid button:active{border-color:var(--green-600);}
  .answer-grid button.ok{background:var(--green-100);border-color:var(--green-600);color:var(--green-900);}
  .answer-grid button.no{background:var(--red-bg);border-color:var(--red);color:#991b1b;}
  /* 模拟考试 */
  .timer{font-variant-numeric:tabular-nums;color:var(--red);font-weight:700;font-size:15px;}
  .hist-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
             border-radius:12px;padding:11px 12px;margin-bottom:8px;}
  .hist-main{flex:1;min-width:0;}
  .hist-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;}
  .hist-date{font-size:12px;color:var(--sub);font-weight:400;}
  .hist-pct{color:var(--green-700);}
  .hist-view{flex-shrink:0;background:var(--green-700);color:#fff;border:none;border-radius:10px;
             padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
  .wrong-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .wrong-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
  .wrong-stem{font-size:14px;font-weight:600;margin:0 0 8px;word-break:break-word;}
  .clear-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;
             font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;}
  .clear-btn:active{border-color:var(--red);color:var(--red);}
  .result-box{text-align:center;padding:20px 10px;}
  .result-num{font-size:44px;font-weight:800;color:var(--green-700);}
  .result-num .sub{font-size:15px;color:var(--sub);font-weight:400;}
  .result-line{font-size:14px;color:var(--sub);margin-top:6px;}
  /* 收藏页 */
  .fav-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
            border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;}
  .fav-item:active{border-color:var(--green-600);}
  .fav-no{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--green-100);
          color:var(--green-900);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .fav-main{flex:1;min-width:0;}
  .fav-head{display:flex;gap:6px;margin-bottom:2px;}
  .fav-stem{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
            -webkit-line-clamp:2;-webkit-box-orient:vertical;}
</style>

/* ===== 存储层 ===== */
let store = { fav: [], examWrong: [], history: [], practice: null, daily: {} };
function load(){
  try{
    const s = JSON.parse(localStorage.getItem("myQuizV2") || "{}");
    store = Object.assign(store, s);
  }catch(e){}
}
function save(){ try{ localStorage.setItem("myQuizV2", JSON.stringify(store)); }catch(e){} }
load();

/* ===== 全局状态 ===== */
let view = "home";
let mode = "order";        // order / random / viewall / fav
let typeFilter = null;
let queue = [];
let idx = 0, picked = [], done = false;
let practiceRes = {};
let examQueue = [], examPicks = {}, examIdx = 0, examStart = 0, timerId = null;
let examResult = null, examPaperRecord = null, examPaperBack = "exam";

/* ===== 工具函数 ===== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtTime(s){ return Math.floor(s / 60) + "分" + (s % 60) + "秒"; }
function fmtClock(s){ return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function fmtDate(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0") + " " +
         String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function fmtDateKey(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
function shuffle(a){ const b = a.slice(); for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function allIds(){ return DATA.map(function(q){ return q.id; }); }
function typeName(q){ return q.type === "multi" ? "多选题" : q.type === "judge" ? "判断题" : "单选题"; }
function isFav(id){ return store.fav.indexOf(id) >= 0; }
function toggleFav(id){
  const i = store.fav.indexOf(id);
  if(i >= 0) store.fav.splice(i, 1); else store.fav.push(id);
  save();
}
/* 今日进度：只统计顺序练习/随机练习（收藏刷题、模拟考试不计入） */
function recordDaily(ok){
  if(!store.daily) store.daily = {};
  const key = fmtDateKey(new Date());
  const day = store.daily[key] || { count: 0, right: 0, wrong: 0 };
  day.count++;
  if(ok) day.right++; else day.wrong++;
  store.daily[key] = day;
  save();
}
function todayStats(){
  const day = (store.daily || {})[fmtDateKey(new Date())];
  return day || { count: 0, right: 0, wrong: 0 };
}
/* 判分：多选必须全选对才算对 */
function checkAnswer(q){
  if(q.type === "multi"){
    if(picked.length !== q.ans.length) return false;
    return q.ans.split("").every(function(x){ return picked.indexOf(x) >= 0; });
  }
  return picked[0] === q.ans;
}
function examCheck(q, sel){
  if(!sel) return false;
  if(q.type === "multi"){
    if(sel.length !== q.ans.length) return false;
    return q.ans.split("").every(function(x){ return sel.indexOf(x) >= 0; });
  }
  return sel === q.ans;
}

/* ===== 进度保存 ===== */
function savePractice(){
  if(mode === "fav") return;   // 收藏刷题不覆盖练习进度
  if(view === "quiz" || view === "list"){
    store.practice = { mode: mode, type: typeFilter, queue: queue, idx: idx, practiceRes: practiceRes };
    save();
  }
}

/* ===== 页面切换 ===== */
function go(name){
  if(name !== "examRun" && timerId){ clearInterval(timerId); timerId = null; }
  view = name;
  render();
  window.scrollTo(0, 0);
}

/* ===== 渲染总入口 ===== */
function render(){
  const v = document.getElementById("view");
  const hs = document.getElementById("headerSub");
  if(view === "home"){ hs.textContent = "碳汇题库 300 题"; v.innerHTML = homeHTML(); }
  else if(view === "pickType"){ hs.textContent = "顺序练习"; v.innerHTML = pickTypeHTML(); }
  else if(view === "quiz"){ hs.textContent = mode === "random" ? "随机练习" : mode === "fav" ? "收藏刷题" : "练习"; v.innerHTML = quizHTML(); }
  else if(view === "viewall"){ hs.textContent = "顺序看题"; v.innerHTML = viewallHTML(); }
  else if(view === "list"){ hs.textContent = "答题卡"; v.innerHTML = listHTML(); }
  else if(view === "fav"){ hs.textContent = "我的收藏"; v.innerHTML = favHTML(); }
  else if(view === "exam"){ hs.textContent = "模拟考试"; v.innerHTML = examHTML(); }
  else if(view === "createExam"){ hs.textContent = "创建试卷"; v.innerHTML = createExamHTML(); }
  else if(view === "examRun"){ hs.textContent = "模拟考试"; v.innerHTML = examRunHTML(); }
  else if(view === "examResult"){ hs.textContent = "考试结果"; v.innerHTML = examResultHTML(); }
  else if(view === "examWrong"){ hs.textContent = "我的错题"; v.innerHTML = examWrongHTML(); }
  else if(view === "examPaper"){ hs.textContent = "查看试卷"; v.innerHTML = examPaperHTML(); }
  document.querySelectorAll("nav button").forEach(function(b){
    b.classList.toggle("active", b.dataset.nav === view);
  });
  savePractice();
}

  const pct = t.count ? Math.round(t.right / t.count * 100) : 0;
  return [
    '<h1 class="page-title">碳汇刷题</h1>',
    '<p class="subtitle">共 ' + DATA.length + ' 题 · 收藏 ' + store.fav.length + ' · 考试 ' + store.history.length + ' 次</p>',

      '<div class="sec-t">今日刷题进度</div>',

  const multi  = DATA.filter(function(q){ return q.type === "multi"; }).length;

      '<button class="list-item" onclick="startOrder(\'multi\')"><span class="no">多</span><span class="txt">多选题</span><span class="muted">' + multi + ' 题</span></button>',
      '<button class="list-item" onclick="startOrder(\'judge\')"><span class="no">判</span><span class="txt">判断题</span><span class="muted">' + judge + ' 题</span></button>',
    '</div>',
    '<button class="back-btn" onclick="go(\'home\')">返回首页</button>',

function startOrder(type){
  const p = store.practice;
  if(p && p.mode === "order" && p.type === type){
    mode = "order"; typeFilter = type;
    queue = p.queue;
    practiceRes = p.practiceRes || {};
    idx = p.idx; picked = []; done = false;
    view = "quiz"; render(); window.scrollTo(0, 0);
    return;
  }
  mode = "order"; typeFilter = type;
  queue = DATA.filter(function(q){ return q.type === type; }).map(function(q){ return q.id; });
  practiceRes = {};
  idx = 0; picked = []; done = false;
  view = "quiz"; render(); window.scrollTo(0, 0);
}

/* ===== 随机练习 ===== */
function startRandom(){
  const p = store.practice;
  if(p && p.mode === "random"){
    mode = "random"; typeFilter = null;
    queue = p.queue;
    practiceRes = p.practiceRes || {};
    idx = p.idx; picked = []; done = false;
    view = "quiz"; render(); window.scrollTo(0, 0);
    return;
  }
  mode = "random"; typeFilter = null;
  queue = shuffle(allIds());
  practiceRes = {};
  idx = 0; picked = []; done = false;
  view = "quiz"; render(); window.scrollTo(0, 0);
}

        '<span class="badge">' + esc(q.module) + '</span>' +
        '<span class="q-progress">' + cur + ' / ' + total + '</span></div>',
      '<div class="q-stem">' + esc(q.stem) + '</div>',
      '<div>' + opts + '</div>',
      '<div class="feedback ok">正确答案：' + q.ans + '</div>',
      '<div class="q-actions">' +
        (idx > 0 ? '<button class="btn ghost" onclick="viewNav(-1)">上一题</button>' : '') +
        (idx < total - 1 ? '<button class="btn pri" onclick="viewNav(1)">下一题</button>' : '<button class="btn pri" onclick="goBackFirst()">从头再看</button>') +
      '</div>',
    '</div>',
  ].join("");
}
function viewNav(d){ idx += d; render(); window.scrollTo(0, 0); }
function goBackFirst(){ idx = 0; render(); window.scrollTo(0, 0); }

/* ===== 刷题页 ===== */
function quizHTML(){
  const q = Q[queue[idx]];
  if(!q) return '<div class="card"><div class="empty">题目加载失败</div></div>';
  const total = queue.length, cur = idx + 1;
  const rec = practiceRes[q.id];               // 已做题记录 { ok, sel }
  const isDone = done || rec !== undefined;    // 此题是否已做
  const mySel = (rec && rec.sel) ? rec.sel.split("") : picked;  // 已做→回显当时选择
  const ok = isDone ? ((rec === true) || (rec && rec.ok)) : null;
  const favBtn = (mode === "fav")
    ? '<button onclick="toggleFav(' + q.id + ');render()">取消收藏</button>'
    : '<button class="' + (isFav(q.id) ? "on" : "") + '" onclick="toggleFav(' + q.id + ');render()">' + (isFav(q.id) ? "已收藏" : "收藏") + '</button>';
  const opts = q.opts.map(function(o){
    let cls = "";
    if(!isDone){
      if(q.type === "multi" && mySel.indexOf(o.k) >= 0) cls = " sel";
    } else {
      cls = " dis";
      if(q.ans.indexOf(o.k) >= 0) cls += " right";
      else if(mySel.indexOf(o.k) >= 0) cls += " wrong";
    }
    return '<button class="opt' + cls + '" onclick="pick(\'' + o.k + '\')">' +
           '<span class="k">' + o.k + '</span><span>' + esc(o.t) + '</span></button>';
  }).join("");
  let feedback = "";
  if(isDone){
    feedback = '<div class="feedback ' + (ok ? "ok" : "no") + '">' +
               (ok ? "回答正确" : "回答错误，正确答案是 " + q.ans) + '</div>';
  }
  const submitBtn = (!isDone && q.type === "multi")
    ? '<button class="btn pri" onclick="submitMulti()">提交答案</button>' : "";
  const nextBtn = isDone ? '<button class="btn pri" onclick="nextQ()">下一题</button>' : "";
  return [
    '<div class="toolbar">',
      '<button onclick="redoAll()">全部重做</button>',
      favBtn,
      '<button onclick="openList()">答题卡</button>',
    '</div>',
    '<div class="card">',
      '<div class="q-head">',
        '<span class="badge">' + typeName(q) + '</span>',
        '<span class="badge">' + esc(q.module) + '</span>',
        '<span class="q-progress">' + cur + ' / ' + total + '</span>',
      '</div>',
      '<div class="q-stem">' + esc(q.stem) + '</div>',
      '<div>' + opts + '</div>',
      feedback,
      '<div class="q-actions">' + submitBtn + nextBtn + '</div>',
    '</div>',
  ].join("");
}
function pick(k){
  const q = Q[queue[idx]];
  if(done || practiceRes[q.id] !== undefined) return;   // 已做题不再重复判分
  if(q.type === "multi"){
    const i = picked.indexOf(k);
    if(i >= 0) picked.splice(i, 1); else picked.push(k);
    render(); return;
  }
  picked = [k]; done = true;
  const ok = (k === q.ans);
  practiceRes[q.id] = { ok: ok, sel: k };              // 存对错 + 选的答案
  if(mode !== "fav") recordDaily(ok);
  render();
}
function submitMulti(){
  const q = Q[queue[idx]];
  if(done || practiceRes[q.id] !== undefined) return;
  if(!picked.length){ alert("请先选择答案"); return; }
  done = true;
  const ok = checkAnswer(q);
  practiceRes[q.id] = { ok: ok, sel: picked.slice().join("") };
  if(mode !== "fav") recordDaily(ok);
  render();
}
function nextQ(){
  if(idx < queue.length - 1){ idx++; picked = []; done = false; render(); window.scrollTo(0, 0); }
  else alert("本组题目已刷完！");
}
function redoAll(){
  idx = 0; picked = []; done = false; practiceRes = {};
  render(); window.scrollTo(0, 0);
}

/* ===== 答题卡 ===== */
function openList(){ view = "list"; render(); window.scrollTo(0, 0); }
function listHTML(){
  const items = queue.map(function(id, i){
    let cls = "";
    if(practiceRes[id] !== undefined){
      const rec = practiceRes[id];
      cls = ((rec === true) || (rec && rec.ok)) ? " ok" : " no";
    }
    return '<button class="' + cls + '" onclick="jumpFromList(' + i + ')">' + (i + 1) + '</button>';
  }).join("");
  return '<div class="card"><div class="sec-t">答题卡<span class="muted">（共 ' + queue.length + ' 题）</span></div>' +
         '<div class="answer-grid">' + items + '</div>' +
         '<button class="back-btn" style="margin-top:10px;" onclick="backToList()">返回</button></div>';
}
function jumpFromList(i){
  idx = i; picked = []; done = false;
  view = (mode === "viewall") ? "viewall" : "quiz";
  render(); window.scrollTo(0, 0);
}
function backToList(){
  view = (mode === "viewall") ? "viewall" : "quiz";
  render(); window.scrollTo(0, 0);
}

/* ===== 收藏页 ===== */
function favHTML(){
  const list = store.fav;
  if(!list.length){
    return '<div class="card"><div class="empty">还没有收藏题目<br>刷题或看题时点"收藏"按钮即可收录</div></div>';
  }
  const items = list.map(function(id, i){
    const q = Q[id];
    return '<div class="fav-item" onclick="startFav(' + i + ')">' +
      '<div class="fav-no">' + (i + 1) + '</div>' +
      '<div class="fav-main">' +
        '<div class="fav-head"><span class="badge">' + typeName(q) + '</span><span class="badge">' + esc(q.module) + '</span></div>' +
        '<div class="fav-stem">' + esc(q.stem) + '</div>' +
      '</div>' +
      '<button class="clear-btn" onclick="event.stopPropagation();removeFav(' + i + ')">取消收藏</button>' +
    '</div>';
  }).join("");
  return '<h1 class="page-title">我的收藏</h1>' +
    '<p class="subtitle">共 ' + list.length + ' 题 · 点击题目开始刷</p>' + items;
}
function startFav(i){
  mode = "fav";
  queue = store.fav.slice();
  practiceRes = {};
  idx = i; picked = []; done = false;
  view = "quiz"; render(); window.scrollTo(0, 0);
}
function removeFav(i){
  store.fav.splice(i, 1);
  save(); render();
}

/* ===== 模拟考试：考试中心 ===== */
function examHTML(){
  const hist = store.history;
  let list = "";
  if(!hist.length){
    list = '<div class="empty">暂无考试记录<br>点击下方"创建试卷"开始第一次模拟考试</div>';
  } else {
    list = hist.map(function(r, i){
      const pct = Math.round(r.correct / r.total * 100);
      return '<div class="hist-item">' +
        '<div class="hist-main">' +
          '<div class="hist-row"><span class="hist-date">' + r.date + '</span><span class="hist-pct">正确率 ' + pct + '%</span></div>' +
          '<div class="hist-row muted">答对 ' + r.correct + ' / 共 ' + r.total + ' 题 · 用时 ' + fmtTime(r.used) + '</div>' +
        '</div>' +
        '<button class="hist-view" onclick="viewPaper(' + i + ')">查看试卷</button>' +
      '</div>';
    }).join("");
  }
  return '<h1 class="page-title">模拟考试</h1>' +
    '<p class="subtitle">近 30 次历史成绩</p>' +
    '<div class="card" style="padding:12px;"><div class="sec-t">历史成绩</div>' + list + '</div>' +
    '<div class="q-actions">' +
      '<button class="btn ghost" onclick="go(\'examWrong\')">我的错题（' + store.examWrong.length + '）</button>' +
      '<button class="btn pri" onclick="go(\'createExam\')">创建试卷</button>' +
    '</div>';
}

/* 创建试卷 */
function createExamHTML(){
  const opts = [10, 30, 50, 100].map(function(n){
    return '<button class="list-item" onclick="startExam(' + n + ')"><span class="no">' + n + '</span><span class="txt">' + n + ' 题</span><span class="muted">随机组卷</span></button>';
  }).join("");
  return '<h1 class="page-title">创建试卷</h1>' +
    '<p class="subtitle">随机抽取题目组成一套模拟试卷</p>' +
    '<div class="card"><div class="sec-t">题目数量</div>' + opts + '</div>' +
    '<button class="back-btn" onclick="go(\'exam\')">返回考试中心</button>';
}
function startExam(n){
  examQueue = shuffle(allIds()).slice(0, n);
  examPicks = {}; examIdx = 0;
  examStart = Date.now();
  if(timerId) clearInterval(timerId);
  view = "examRun"; render();
  timerId = setInterval(updateTimer, 1000);
  window.scrollTo(0, 0);
}
function updateTimer(){
  const el = document.getElementById("timerText");
  if(el) el.textContent = fmtClock(Math.floor((Date.now() - examStart) / 1000));
}

/* 考试运行 */
function examRunHTML(){
  const q = Q[examQueue[examIdx]];
  const total = examQueue.length, cur = examIdx + 1;
  const sel = examPicks[q.id] || "";
  const opts = q.opts.map(function(o){
    const cls = (sel.indexOf(o.k) >= 0) ? " sel" : "";
    return '<button class="opt' + cls + '" onclick="examPick(\'' + o.k + '\')">' +
           '<span class="k">' + o.k + '</span><span>' + esc(o.t) + '</span></button>';
  }).join("");
  return [
    '<div class="card">',
      '<div class="q-head"><span class="badge">' + typeName(q) + '</span>' +
        '<span class="q-progress">' + cur + ' / ' + total + '</span></div>',
      '<div class="q-head" style="margin-top:-6px;">' +
        '<span class="timer" id="timerText">' + fmtClock(Math.floor((Date.now() - examStart) / 1000)) + '</span>' +
        '<span class="muted">已答 ' + Object.keys(examPicks).length + ' 题</span>' +
        '<button class="hist-view" style="margin-left:auto;" onclick="submitExam()">交卷</button>' +
      '</div>',
      '<div class="q-stem">' + esc(q.stem) + '</div>',
      '<div>' + opts + '</div>',
      '<div class="q-actions">' +
        (examIdx > 0 ? '<button class="btn ghost" onclick="examNav(-1)">上一题</button>' : '') +
        '<button class="btn pri" onclick="examNav(1)">下一题</button>' +
      '</div>',
    '</div>',
  ].join("");
}
function examPick(k){
  const q = Q[examQueue[examIdx]];
  const id = q.id;
  let cur = examPicks[id] || "";
  if(q.type === "multi"){
    const i = cur.indexOf(k);
    if(i >= 0) cur = cur.replace(k, ""); else cur += k;
  } else {
    cur = k;
  }
  examPicks[id] = cur;
  render();
}
function examNav(d){ examIdx += d; render(); window.scrollTo(0, 0); }
function submitExam(){
  if(!confirm("确认交卷？")) return;
  clearInterval(timerId); timerId = null;
  let correct = 0; const wrong = [];
  examQueue.forEach(function(id){
    if(examCheck(Q[id], examPicks[id] || "")) correct++;
    else wrong.push(id);
  });
  const used = Math.floor((Date.now() - examStart) / 1000);
  const rec = { date: fmtDate(new Date()), total: examQueue.length, correct: correct,
                used: used, wrong: wrong, questions: examQueue.slice() };
  store.history.unshift(rec);
  if(store.history.length > 30) store.history = store.history.slice(0, 30);
  wrong.forEach(function(id){ if(store.examWrong.indexOf(id) < 0) store.examWrong.push(id); });
  save();
  examResult = rec;
  view = "examResult"; render(); window.scrollTo(0, 0);
}

/* 考试结果 */
function examResultHTML(){
  const r = examResult;
  const pct = Math.round(r.correct / r.total * 100);
  return '<div class="card"><div class="result-box">' +
    '<div class="result-num">' + pct + '<span class="sub">%</span></div>' +
    '<div class="result-line">答对 ' + r.correct + ' / ' + r.total + ' 题 · 用时 ' + fmtTime(r.used) + '</div>' +
    '<div class="result-line muted">' + r.date + '</div>' +
  '</div></div>' +
  '<div class="q-actions">' +
    '<button class="btn ghost" onclick="viewResultPaper()">查看本次试卷</button>' +
    '<button class="btn pri" onclick="go(\'exam\')">返回考试中心</button>' +
  '</div>';
}
function viewResultPaper(){ examPaperRecord = examResult; examPaperBack = "examResult"; view = "examPaper"; render(); window.scrollTo(0, 0); }

/* 查看试卷（只读） */
function viewPaper(i){ examPaperRecord = store.history[i]; examPaperBack = "exam"; view = "examPaper"; render(); window.scrollTo(0, 0); }
function examPaperHTML(){
  const r = examPaperRecord;
  const items = r.questions.map(function(id, i){
    const q = Q[id];
    const wrong = r.wrong.indexOf(id) >= 0;
    const opts = q.opts.map(function(o){
      const right = q.ans.indexOf(o.k) >= 0;
      return '<button class="opt dis' + (right ? " right" : "") + '"><span class="k">' + o.k + '</span><span>' + esc(o.t) + '</span></button>';
    }).join("");
    return '<div class="card" style="margin-bottom:10px;">' +
      '<div class="q-head"><span class="badge">第 ' + (i + 1) + ' 题</span><span class="badge">' + typeName(q) + '</span>' +
      (wrong ? '<span class="badge judge">答错</span>' : '<span class="badge">答对</span>') + '</div>' +
      '<div class="q-stem">' + esc(q.stem) + '</div>' +
      '<div>' + opts + '</div>' +
      '<div class="feedback ok">正确答案：' + q.ans + '</div>' +
    '</div>';
  }).join("");
  return '<div class="card"><div class="sec-t">考试试卷<span class="muted">' + r.date + ' · 得分 ' + r.correct + '/' + r.total + '</span></div></div>' +
    items +
    '<button class="back-btn" onclick="go(\'' + examPaperBack + '\')">返回</button>';
}

/* 我的错题 */
function examWrongHTML(){
  const list = store.examWrong;
  if(!list.length){
    return '<div class="card"><div class="empty">暂无错题<br>模拟考试答错的题会收录在这里</div></div>' +
           '<button class="back-btn" onclick="go(\'exam\')">返回考试中心</button>';
  }
  const items = list.map(function(id, i){
    const q = Q[id];
    const opts = q.opts.map(function(o){
      const right = q.ans.indexOf(o.k) >= 0;
      return '<button class="opt dis' + (right ? " right" : "") + '"><span class="k">' + o.k + '</span><span>' + esc(o.t) + '</span></button>';
    }).join("");
    return '<div class="wrong-item">' +
      '<div class="wrong-head"><span class="badge">错题 ' + (i + 1) + '</span>' +
      '<button class="clear-btn" onclick="clearOneWrong(' + i + ')">清除本题</button></div>' +
      '<div class="wrong-stem">' + esc(q.stem) + '</div>' +
      '<div>' + opts + '</div>' +
      '<div class="feedback ok">正确答案：' + q.ans + '</div>' +
    '</div>';
  }).join("");
  return '<div class="card"><div class="sec-t">我的错题<span class="muted">（共 ' + list.length + ' 题）</span>' +
    '<button class="clear-btn" onclick="clearAllWrong()">全部清除</button></div></div>' + items +
    '<button class="back-btn" onclick="go(\'exam\')">返回考试中心</button>';
}
function clearOneWrong(i){
  store.examWrong.splice(i, 1);
  save(); render();
}
function clearAllWrong(){
  if(!confirm("确认清空全部错题？")) return;
  store.examWrong = [];
  save(); render();
}

render();
</script>
</body>
</html>
